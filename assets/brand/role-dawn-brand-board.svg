    <line x1="30" y1="76" x2="392" y2="76" stroke="#E5E7EB"/>
    <text x="30" y="111" fill="#667085" font-family="IBM Plex Mono, monospace" font-size="12">ROLE</text>
    <text x="30" y="137" fill="#0B1020" font-family="Instrument Sans, Arial, sans-serif" font-size="18" font-weight="600">Solutions Consultant</text>
    <text x="30" y="177" fill="#667085" font-family="IBM Plex Mono, monospace" font-size="12">SENT</text>
    <text x="30" y="203" fill="#0B1020" font-family="IBM Plex Mono, monospace" font-size="15">12:03 AM · Greenhouse</text>
    <text x="30" y="243" fill="#667085" font-family="IBM Plex Mono, monospace" font-size="12">PROOF</text>
    <text x="30" y="269" fill="#0B1020" font-family="Instrument Sans, Arial, sans-serif" font-size="16">7 fields · 2 files · confirmation saved</text>
    <path d="M30 297h362" stroke="#E5E7EB"/>
    <circle cx="42" cy="314" r="7" fill="#85E0C5"/>
    <text x="58" y="319" fill="#667085" font-family="IBM Plex Mono, monospace" font-size="12">Nothing invented. Nothing outside your rules.</text>
