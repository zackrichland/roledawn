<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">RoleDawn working brand board</title>
  <desc id="desc">A midnight-to-dawn visual system with a message-horizon mark, typography direction, colors, and application receipt motif.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.7" stop-color="#171D33"/>
      <stop offset="1" stop-color="#3B2940"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="#F7F8FC"/>
  <rect width="1440" height="430" fill="url(#sky)"/>

  <g transform="translate(88 74)">
    <path d="M0 52c0-24 19-43 43-43h72c24 0 43 19 43 43v24c0 24-19 43-43 43H65L35 143l7-24C18 118 0 99 0 76Z" fill="none" stroke="#FFD166" stroke-width="8" stroke-linejoin="round"/>
    <path d="M64 95h94" stroke="#FFD166" stroke-width="8" stroke-linecap="round"/>
    <circle cx="112" cy="70" r="12" fill="#FF6B5F"/>
    <text x="196" y="91" fill="#F7F8FC" font-family="Instrument Sans, Arial, sans-serif" font-size="64" font-weight="650" letter-spacing="-2">RoleDawn</text>
    <text x="4" y="205" fill="#FFD166" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="1">11:47 PM → 12:03 AM</text>
    <text x="4" y="266" fill="#F7F8FC" font-family="Instrument Sans, Arial, sans-serif" font-size="52" font-weight="620" letter-spacing="-1.5">Your job search has a night shift.</text>
    <text x="4" y="313" fill="#D6D9E4" font-family="Instrument Sans, Arial, sans-serif" font-size="22">Evidence-backed applications. Approval by text. A receipt for every confirmed submission.</text>
  </g>

  <g transform="translate(88 490)">
