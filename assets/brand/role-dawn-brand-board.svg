    <text x="30" y="18" fill="#667085" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1">ILLUSTRATIVE</text>
    <text x="30" y="48" fill="#0B1020" font-family="Instrument Sans, Arial, sans-serif" font-size="20" font-weight="650">Application Receipt</text>
    <rect x="292" y="22" width="100" height="34" rx="17" fill="#DDF7EF"/>
